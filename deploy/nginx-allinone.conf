# JUMBO — TEK CONTAINER için TAM nginx yapılandırması (main + http + server).
# Port düzeni (kullanıcı isteği):
#   :8080  → ÖN KAPI (önyüz). Kullanıcı buraya bağlanır. /api → backend(5000), /* → frontend(9080).
#   :9080  → FRONTEND. React SPA statik dosyaları (+ SPA fallback). /api'yi de 5000'e proxy'ler
#            (9080'e doğrudan erişimde de app tam çalışsın diye).
#   :5000  → BACKEND (uvicorn, yalnız 127.0.0.1; supervisord başlatır).
#
# OpenShift NOTU: container rastgele non-root UID (GID 0) ile çalışır → nginx'in yazdığı HER yol /tmp
# altında (pid + temp), loglar stdout/stderr'e. 8080/9080 (>1024) ayrıcalıksız portlardır.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # LOG DÜZENİ (tek kaynak, tek biçim):
    #   • Biçim app loglarıyla hizalı: zaman + ACCESS etiketi + durum + istek + süre.
    #   • TEK access kaynağı ÖN KAPI (:8080)'dır — :9080 iç sıçramadır, kapalı (çift satır önlenir).
    #   • uvicorn access de kapalı (app tarafı, logging_config) — istek başına TEK satır düşer.
    log_format  main  '$time_iso8601 ACCESS   [nginx] $status $remote_addr "$request" '
                      '${body_bytes_sent}B ${request_time}s';
    access_log    /dev/stdout main;

    # Rastgele UID yazabilsin diye tüm geçici yollar /tmp altında
    client_body_temp_path  /tmp/nginx-client;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    sendfile      on;
    keepalive_timeout  65;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    # Yüklenen sertifika dosyaları (PEM/DER/PFX) için gövde limiti (her iki blokta da geçerli)
    client_max_body_size  16m;

    # ===================================================================
    # FRONTEND — React SPA statik (:9080)
    # ===================================================================
    server {
        listen       9080;
        server_name  _;

        # İç sıçrama (:8080 → :9080): ön kapı zaten logladı — ikinci satır üretme.
        # (9080'e doğrudan erişim yalnız container içi/debug içindir.)
        access_log  off;

        root   /usr/share/nginx/html;
        index  index.html;

        # 9080'e doğrudan erişimde de API çalışsın diye backend'e proxy
        location /api/ {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /assets/ {
            expires    30d;
            add_header  Cache-Control "public, immutable";
        }

        # index.html HİÇ önbelleklenmez: hash'li /assets/ dosyalarına referansı o taşıyor —
        # tarayıcı bunu önbellekte tutarsa deploy sonrası hard-refresh'e kadar eski JS/CSS
        # sunulmaya devam eder (deploy sonrası "değişiklikleri göremiyorum" şikayetinin kökü).
        location = /index.html {
            add_header  Cache-Control "no-cache";
        }

        # SPA fallback: gerçek dosya yoksa index.html (React Router)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ===================================================================
    # ÖN KAPI (önyüz) — reverse proxy (:8080)
    #   /api → backend(5000) ,  /* → frontend(9080)
    # ===================================================================
    server {
        listen       8080;
        server_name  _;

        # Sağlık probu (k8s liveness/readiness her ~10sn vurur) — access log'u doldurmasın
        location = /api/health {
            access_log         off;
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # API doğrudan backend'e (proxy zinciri kısalsın)
        location /api/ {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Swagger UI / OpenAPI şeması — FastAPI'nin /docs'unu ön kapıda aç (backend :5000).
        # /docs prefix'i /docs, /docs/static/* (SELF-HOSTED Swagger JS/CSS — app/static/swagger,
        # internet/CDN GEREKMEZ) ve /docs/oauth2-redirect'i kapsar; /openapi.json Swagger'ın
        # şemayı çekmesi için ZORUNLU (yoksa UI boş açılır).
        # GÜVENLİK: bu, tüm API yüzeyini ön kapıda görünür kılar; kapatmak istenirse bu 3 bloğu sil.
        location /docs {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location = /openapi.json {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
        location /redoc {
            proxy_pass         http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Statik varlıklar (parmak izli, 30 gün immutable önbellekli) — istek başına log gürültüsü
        location ~* ^/(assets/|favicon) {
            access_log         off;
            proxy_pass         http://127.0.0.1:9080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
        }

        # Geri kalan her şey frontend'e (9080)
        location / {
            proxy_pass         http://127.0.0.1:9080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}

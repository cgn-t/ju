; JUMBO — TEK CONTAINER süreç yöneticisi.
; supervisord PID 1 olarak iki süreci yönetir: backend (uvicorn :5000) ve nginx (ön kapı :8080 + frontend :9080).
; OpenShift NOTU: rastgele non-root UID ile çalışır → socket/pidfile /tmp'de, loglar stdout'ta.

[supervisord]
nodaemon=true
logfile=/dev/null            ; supervisord kendi logunu tutmaz; program logları stdout'a
pidfile=/tmp/supervisord.pid
; user= AYARLANMAZ: UID'yi OpenShift / `docker --user` belirler, supervisord setuid denemez

[unix_http_server]
file=/tmp/supervisor.sock    ; rastgele UID yazabilsin diye /tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- backend: uvicorn, yalnız container içi (127.0.0.1:5000) ---
[program:api]
command=uvicorn app.main:app --host 127.0.0.1 --port 5000 --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_events_enabled=true

; --- web: nginx ön planda (daemon off) ---
[program:web]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
stdout_events_enabled=true

# JUMBO imajını derleyip GitHub Container Registry'ye (ghcr.io) gönderir.
#   Ne zaman: main'e her birleştirmede + Actions sekmesinden elle ("Run workflow").
#   PR'larda yalnız derler (gönderMEZ) — Dockerfile bozulursa main'e girmeden görünür.
#   Etiketler: backend/VERSION (örn. 3.8.12), latest ve commit kısa SHA'sı.
#   Platform: linux/amd64 (OpenShift düğümleri). İmaj kök Dockerfile'dan derlenir
#   ve zaten OpenShift arbitrary-UID uyumludur (non-root, 8080/9080 portları).
# OpenShift'e çekme: deploy/README.md → "GitHub'dan imaj (ghcr.io)".
name: Imaj

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imaj-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm ve imaj adı
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < backend/VERSION)"
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/jumbo"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Özet
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### İmaj hazır"
            echo '```'
            echo "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
            echo "${{ steps.meta.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
